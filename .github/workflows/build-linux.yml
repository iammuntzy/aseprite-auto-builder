name: Build Aseprite (Linux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip jq cmake ninja-build clang g++ \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libfontconfig1-dev libxinerama-dev

      - name: Detect Skia branch
        id: skia_branch
        run: |
          BRANCH=$(grep -oE 'aseprite-m[0-9]+' INSTALL.md | head -n 1 | sed 's/aseprite-//')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Get Skia release
        id: skia_release
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/aseprite/skia/releases \
            | jq -r ".[] | select(.tag_name | startswith(\"${{ steps.skia_branch.outputs.branch }}-\")) | .tag_name" \
            | head -n 1)

          echo "release=$RELEASE" >> $GITHUB_OUTPUT

      - name: Download Skia
        run: |
          curl -L https://github.com/aseprite/skia/releases/download/${{ steps.skia_release.outputs.release }}/Skia-Linux-Release-x64.zip -o skia.zip
          unzip skia.zip -d skia

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$PWD/skia \
            -DSKIA_LIBRARY_DIR=$PWD/skia/out/Release-x64 \
            -DSKIA_LIBRARY=$PWD/skia/out/Release-x64/libskia.a

      - name: Build
        run: cmake --build build --target aseprite

      - name: Package
        run: |
          mkdir artifact
          cp -r build/bin/* artifact/
          echo '# portable' > artifact/aseprite.ini

          zip -r aseprite-linux.zip artifact

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux
          path: aseprite-linux.zip
