name: Build Latest Aseprite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------------------------------------
          # Linux
          # -------------------------------------------------------
          - os: ubuntu-22.04
            artifact: linux-x64
            skia_file: Skia-Linux-Release-x64.zip
            skia_dir: Release-x64
            skia_lib: libskia.a

          # -------------------------------------------------------
          # Windows
          # -------------------------------------------------------
          - os: windows-2022
            artifact: windows-x64
            skia_file: Skia-Windows-Release-x64.zip
            skia_dir: Release-x64
            skia_lib: skia.lib

          # -------------------------------------------------------
          # macOS Intel
          # -------------------------------------------------------
          - os: macos-13
            artifact: macos-intel
            skia_file: Skia-macOS-Release-x64.zip
            skia_dir: Release-x64
            skia_lib: libskia.a
            mac_arch: x86_64
            mac_target: "10.14"

          # -------------------------------------------------------
          # macOS Apple Silicon
          # -------------------------------------------------------
          - os: macos-14
            artifact: macos-arm64
            skia_file: Skia-macOS-Release-arm64.zip
            skia_dir: Release-arm64
            skia_lib: libskia.a
            mac_arch: arm64
            mac_target: "11.0"

    runs-on: ${{ matrix.os }}

    steps:
      # -------------------------------------------------------
      # Install Linux dependencies
      # -------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            jq \
            p7zip-full \
            cmake \
            ninja-build \
            clang \
            g++ \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libxinerama-dev

      # -------------------------------------------------------
      # Install macOS dependencies
      # -------------------------------------------------------
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake jq p7zip

      # -------------------------------------------------------
      # Install Windows dependencies
      # -------------------------------------------------------
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja cmake jq unzip 7zip -y

      # -------------------------------------------------------
      # Get latest Aseprite release
      # -------------------------------------------------------
      - name: Get latest Aseprite release
        id: aseprite
        shell: bash
        run: |
          TAG=$(curl -s https://api.github.com/repos/aseprite/aseprite/releases/latest | jq -r .tag_name)

          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "Latest release: $TAG"

      # -------------------------------------------------------
      # Checkout Aseprite source
      # -------------------------------------------------------
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ steps.aseprite.outputs.tag }}
          submodules: recursive

      # -------------------------------------------------------
      # Detect required Skia branch
      # -------------------------------------------------------
      - name: Detect Skia branch
        id: skia_branch
        shell: bash
        run: |
          BRANCH=$(grep -oE 'aseprite-m[0-9]+' INSTALL.md | head -n 1 | sed 's/aseprite-//')

          if [ -z "$BRANCH" ]; then
            echo "Could not detect required Skia branch"
            exit 1
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          echo "Detected branch: $BRANCH"

      # -------------------------------------------------------
      # Find latest compatible Skia release
      # -------------------------------------------------------
      - name: Find matching Skia release
        id: skia_release
        shell: bash
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/aseprite/skia/releases \
            | jq -r '
                .[]
                | select(.tag_name | startswith("${{ steps.skia_branch.outputs.branch }}-"))
                | .tag_name
              ' \
            | head -n 1)

          if [ -z "$RELEASE" ]; then
            echo "No compatible Skia release found"
            exit 1
          fi

          echo "release=$RELEASE" >> $GITHUB_OUTPUT

          echo "Matched release: $RELEASE"

      # -------------------------------------------------------
      # Build Skia URL
      # -------------------------------------------------------
      - name: Build Skia URL
        id: skia
        shell: bash
        run: |
          URL="https://github.com/aseprite/skia/releases/download/${{ steps.skia_release.outputs.release }}/${{ matrix.skia_file }}"

          echo "url=$URL" >> $GITHUB_OUTPUT

          echo "Download URL: $URL"

      # -------------------------------------------------------
      # Cache Skia
      # -------------------------------------------------------
      - name: Cache Skia
        id: cache-skia
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-${{ runner.os }}-${{ matrix.artifact }}-${{ steps.skia_release.outputs.release }}

      # -------------------------------------------------------
      # Download Skia
      # -------------------------------------------------------
      - name: Download Skia
        if: steps.cache-skia.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -L "${{ steps.skia.outputs.url }}" -o skia.zip

          unzip skia.zip -d skia

          mkdir -p skia/third_party/externals/libjpeg-turbo

      # -------------------------------------------------------
      # Setup MSVC
      # -------------------------------------------------------
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # -------------------------------------------------------
      # Configure Linux build
      # -------------------------------------------------------
      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CC=clang
          export CXX=clang++

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++ \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_TESTS=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=${{ github.workspace }}/skia \
            -DSKIA_LIBRARY_DIR=${{ github.workspace }}/skia/out/${{ matrix.skia_dir }} \
            -DSKIA_LIBRARY=${{ github.workspace }}/skia/out/${{ matrix.skia_dir }}/${{ matrix.skia_lib }}

      # -------------------------------------------------------
      # Configure Windows build
      # -------------------------------------------------------
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_TESTS=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=${{ github.workspace }}/skia \
            -DSKIA_LIBRARY_DIR=${{ github.workspace }}/skia/out/${{ matrix.skia_dir }} \
            -DSKIA_LIBRARY=${{ github.workspace }}/skia/out/${{ matrix.skia_dir }}/${{ matrix.skia_lib }}

      # -------------------------------------------------------
      # Configure macOS build
      # -------------------------------------------------------
      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EXTRA_ARGS=""

          if [ "${{ matrix.mac_arch }}" = "arm64" ]; then
            EXTRA_ARGS="-DPNG_ARM_NEON:STRING=on"
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.mac_arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.mac_target }} \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path) \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_TESTS=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=${{ github.workspace }}/skia \
            -DSKIA_LIBRARY_DIR=${{ github.workspace }}/skia/out/${{ matrix.skia_dir }} \
            -DSKIA_LIBRARY=${{ github.workspace }}/skia/out/${{ matrix.skia_dir }}/${{ matrix.skia_lib }} \
            $EXTRA_ARGS

      # -------------------------------------------------------
      # Build Aseprite
      # -------------------------------------------------------
      - name: Build Aseprite
        run: |
          cmake --build build --target aseprite --config Release

      # -------------------------------------------------------
      # Prepare artifact folder
      # -------------------------------------------------------
      - name: Prepare artifact folder
        shell: bash
        run: |
          mkdir -p artifact

          cp -r build/bin/* artifact/

      # -------------------------------------------------------
      # Cleanup build output
      # -------------------------------------------------------
      - name: Cleanup build output
        shell: bash
        working-directory: artifact
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            find . -mindepth 1 \
              ! \( \
                -name 'aseprite.exe' -o \
                -name 'data' -o \
                -name '*.dll' \
              \) \
              -exec rm -rf {} +
          elif [ "$RUNNER_OS" = "macOS" ]; then
            find . -mindepth 1 \
              ! \( \
                -name 'Aseprite.app' -o \
                -name 'data' \
              \) \
              -exec rm -rf {} +
          else
            find . -mindepth 1 \
              ! \( \
                -name 'aseprite' -o \
                -name 'data' -o \
                -name '*.so*' \
              \) \
              -exec rm -rf {} +
          fi

      # -------------------------------------------------------
      # Enable portable mode
      # -------------------------------------------------------
      - name: Enable portable mode
        shell: bash
        working-directory: artifact
        run: |
          echo '#Enable portable mode' > aseprite.ini

      # -------------------------------------------------------
      # Create ZIP package
      # -------------------------------------------------------
      - name: Create ZIP package
        shell: bash
        run: |
          mkdir -p packaged

          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a \
              packaged/aseprite-${{ matrix.artifact }}-${{ steps.aseprite.outputs.tag }}.zip \
              ./artifact/*
          else
            cd artifact

            zip -r \
              ../packaged/aseprite-${{ matrix.artifact }}-${{ steps.aseprite.outputs.tag }}.zip \
              .
          fi

      # -------------------------------------------------------
      # Upload artifact
      # -------------------------------------------------------
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.artifact }}-${{ steps.aseprite.outputs.tag }}
          path: packaged/*.zip
